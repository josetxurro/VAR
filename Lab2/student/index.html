class DisplaySurface 
{
    constructor(name, origin, u_vector, v_vector, color) 
    {
        this.name = name;
        this.origin = origin;
        this.u = u_vector;
        this.v = v_vector;
        this.color = color;
    }

	viewMatrix(eye)
    {
        // norm (n = u × v)
        var n = new THREE.Vector3().crossVectors(this.u, this.v).normalize();

        // target: point from in direction of -norm
        var target = new THREE.Vector3().addVectors(eye, n.clone().negate());

        // up vector
        var upVector = this.v.clone().normalize();

        var mat = new THREE.Matrix4();
        mat = mat.lookAt(eye, target, upVector); // solo rotación
        var translate = new THREE.Matrix4().makeTranslation(-eye.x, -eye.y, -eye.z);
        mat = mat.multiplyMatrices(mat, translate);

        return mat;
    }
	
    projectionMatrix(eye, znear, zfar) {
        // Normalized wall axes
        var u = this.u.clone().normalize();
        var v = this.v.clone().normalize();
        var n = new THREE.Vector3().crossVectors(u, v).normalize();

        // Vectors from eye to three corners of the wall
        var pa = this.origin.clone();            // lower-left corner (origin)
        var pb = this.origin.clone().add(this.u); // lower-right (origin + u)
        var pc = this.origin.clone().add(this.v); // upper-left  (origin + v)

        var va = pa.clone().sub(eye);
        var vb = pb.clone().sub(eye);
        var vc = pc.clone().sub(eye);

        // Distance from eye to screen (near plane)
        var d = -va.dot(n);

        // Frustum parameters at the near plane
        var left   = va.dot(u) * znear / d;
        var right  = vb.dot(u) * znear / d;
        var bottom = va.dot(v) * znear / d;
        var top    = vc.dot(v) * znear / d;

        var projMat = new THREE.Matrix4().makePerspective(left, right, top, bottom, znear, zfar);
        return projMat;
    }

    showEyeFrustrum(eye) {
        var u = this.u.clone().normalize();
        var v = this.v.clone().normalize();
        var n = new THREE.Vector3().crossVectors(u, v).normalize();

        // Vectors from eye to four corners of the wall
        var pa = this.origin.clone(); // lower-left corner (origin)
        var pb = this.origin.clone().add(this.u); // lower-right (origin + u)
        var pc = this.origin.clone().add(this.v); // upper-left  (origin + v)
        var pd = this.origin.clone().add(this.u).add(this.v); // upper-right (origin + u + v)
        
        // Create a group to hold both mesh and lines
        var group = new THREE.Group();
        
        // Create 4 triangular surfaces from eye to each edge of the screen
        var vertices = new Float32Array([
            // Triangle 1: eye -> pa -> pb
            eye.x, eye.y, eye.z,
            pa.x, pa.y, pa.z,
            pb.x, pb.y, pb.z,
            
            // Triangle 2: eye -> pb -> pd
            eye.x, eye.y, eye.z,
            pb.x, pb.y, pb.z,
            pd.x, pd.y, pd.z,
            
            // Triangle 3: eye -> pd -> pc
            eye.x, eye.y, eye.z,
            pd.x, pd.y, pd.z,
            pc.x, pc.y, pc.z,
            
            // Triangle 4: eye -> pc -> pa
            eye.x, eye.y, eye.z,
            pc.x, pc.y, pc.z,
            pa.x, pa.y, pa.z,
        ]);

        var geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
        geometry.computeVertexNormals();
        
        var material = new THREE.MeshBasicMaterial({
            color: this.color,
            transparent: true,
            opacity: 0.15,
            side: THREE.DoubleSide,
            depthWrite: false
        });
        
        var mesh = new THREE.Mesh(geometry, material);
        group.add(mesh);
        
        // Add edge lines
        var linePoints = new Float32Array([
            eye.x, eye.y, eye.z,   pa.x, pa.y, pa.z,
            eye.x, eye.y, eye.z,   pb.x, pb.y, pb.z,
            eye.x, eye.y, eye.z,   pc.x, pc.y, pc.z,
            eye.x, eye.y, eye.z,   pd.x, pd.y, pd.z,
        ]);
        
        var lineGeometry = new THREE.BufferGeometry();
        lineGeometry.setAttribute('position', new THREE.BufferAttribute(linePoints, 3));
        var lineMaterial = new THREE.LineBasicMaterial({color: this.color});
        var lines = new THREE.LineSegments(lineGeometry, lineMaterial);
        group.add(lines);

        return group;
    }
    
}

    head.position.set(eyeCenter.x, eyeCenter.y, eyeCenter.z);
    eyeScene.add(head);

    // add spheres representing L/R eyes
    var geometry = new THREE.SphereGeometry( 3, 32, 22 );
    var material = new THREE.MeshPhongMaterial( { color: 0xff0000 } );
    var sphere = new THREE.Mesh( geometry, material );
    sphere.name = "EyeL";
    sphere.position.set(eyeL.x, eyeL.y, eyeL.z);
    head.add(sphere);
	
    var geometry = new THREE.SphereGeometry( 3, 32, 22 );
    var material = new THREE.MeshPhongMaterial( { color: 0x0000ff } );
    var sphere = new THREE.Mesh( geometry, material );
    sphere.name = "EyeR";
    sphere.position.set(eyeR.x, eyeR.y, eyeR.z);
	head.add(sphere);
    
    createLights(eyeScene);

/**
 * Create a collection of cylinders arranged in a circular path
 * Creates 20 cylinders with rainbow colors distributed evenly around a circle
 * Each cylinder stores its initial angle and index for animation purposes
 */
function createTunnelCylinders() {
    const cylinderCount = 20;
    const cylinderLength = 15; // Short cylinders
    const cylinderRadius = 8;
    const pathRadius = 80; // Radius of the circular path
    
    for (let i = 0; i < cylinderCount; i++) {
        // Create cylinder
        const geometry = new THREE.CylinderGeometry(cylinderRadius, cylinderRadius, cylinderLength, 32);
        
        // Rainbow gradient color
        const hue = i / cylinderCount;
        const material = new THREE.MeshPhongMaterial({ 
            color: new THREE.Color().setHSL(hue, 0.8, 0.5),
            side: THREE.DoubleSide
        });
        
        const cylinder = new THREE.Mesh(geometry, material);
        
        // Save initial angle for circular path
        cylinder.userData.angle = (i / cylinderCount) * Math.PI * 2;
        cylinder.userData.index = i;
        
        tunnelCylinders.push(cylinder);
        group.add(cylinder);
    }
}

/**
 * Update the position and orientation of cylinders on their circular path
 * @param {number} dt - Delta time in seconds since last frame
 * 
 * Animates cylinders moving in a circle with expanding/contracting radius
 * The path radius oscillates between 50 and 200 units
 * Cylinders rotate around the circle and are oriented tangent to the path
 */
function updateTunnelCylinders(dt) {
    tunnelTime += dt;
    
    // Radius contracts and expands
    const minRadius = 50;
    const maxRadius = 200;
    const pathRadius = minRadius + (maxRadius - minRadius) * (Math.sin(tunnelTime * 0.5) * 0.5 + 0.5);
    
    const speed = 0.5; // Rotation speed on the circle
    
    for (let cylinder of tunnelCylinders) {
        // Update angle for circular motion
        cylinder.userData.angle += speed * dt;
        
        // Position on circular path (XZ plane)
        const angle = cylinder.userData.angle;
        cylinder.position.x = Math.cos(angle) * pathRadius;
        cylinder.position.z = Math.sin(angle) * pathRadius;
        cylinder.position.y = 0;
        
        // Orient cylinder tangent to the circle (pointing in movement direction)
        cylinder.rotation.y = angle + Math.PI / 2;
        
        // Small tilt for visual effect
        cylinder.rotation.z = Math.sin(tunnelTime + cylinder.userData.index) * 0.1;
    }
}

/**
 * Create a scene with 3D objects representing the display surfaces
 * Creates textured planes for each CAVE display surface (Front, Left, Right, Floor)
 * Each surface is positioned and oriented according to its DisplaySurface definition
 */
function createDisplaySurfaceScene()
{
    displaySurfaceScene = new THREE.Scene();

    // add display surfaces
    for (var [index, displaySurface] of displaySurfaces.entries())
    {
        var origin = displaySurface.origin;
        var u = displaySurface.u;
        var v = displaySurface.v;
  
        var geometry = new THREE.BoxGeometry(u.length(), v.length(), 0.01);
        var material = new THREE.MeshPhongMaterial( {map: displaySurfaceTargets[index].texture} );
        var cube = new THREE.Mesh( geometry, material );
        cube.name = displaySurface.name;
        if (displaySurface.name == "Left")
            cube.rotation.y = Math.PI / 2;
       
		if (displaySurface.name == "Right")
            cube.rotation.y = - Math.PI / 2;
			
		if (displaySurface.name == "Floor")
		{
            cube.rotation.x =  Math.PI / 2;
			cube.rotation.z =  Math.PI ;
		}
       
	    var uHalf = u.clone().multiplyScalar(0.5);
		var vHalf = v.clone().multiplyScalar(0.5);
		var center = new THREE.Vector3().addVectors(origin, uHalf);
		center.add(vHalf);
		cube.position.set(center.x, center.y, center.z);
		
        displaySurfaceScene.add(cube);
    }
    
    createLights(displaySurfaceScene);
}

/**
 * Create a camera from view and projection matrices
 * @param {THREE.Matrix4} view - The view matrix
 * @param {THREE.Matrix4} proj - The projection matrix
 * @returns {THREE.Camera} A camera configured with the given matrices
 */
function cameraFromViewProj(view, proj)
{
	var cam = camera.clone();
    var inv = new THREE.Matrix4();
	inv.copy(view).invert();
	cam.position.set(inv.elements[12], inv.elements[13], inv.elements[14]);
	cam.setRotationFromMatrix(view);
	cam.projectionMatrix = proj.clone();
	return cam;
}

/**
 * Setup VR controllers
 * Initializes two XR controllers with models, adds them to the dolly
 * Sets up raycaster for interaction and event listeners
 */

    // Controller 1
    controller1 = renderer.xr.getController(0);
    dolly.add(controller1);  // Cambiar de displaySurfaceScene a dolly

    controllerGrip1.add(controllerModelFactory.createControllerModel(controllerGrip1));
    dolly.add(controllerGrip1);  // Cambiar de displaySurfaceScene a dolly

    // Controller 2
    controller2 = renderer.xr.getController(1);
    dolly.add(controller2);  // Cambiar de displaySurfaceScene a dolly
    controllerGrip2 = renderer.xr.getControllerGrip(1);
    controllerGrip2.add(controllerModelFactory.createControllerModel(controllerGrip2));
    dolly.add(controllerGrip2);  // Cambiar de displaySurfaceScene a dolly

    controller1.addEventListener('selectstart', onSelectStart);
    controller2.addEventListener('selectstart', onSelectStart);
    controller1.addEventListener('selectend', onSelectEnd);
    controller2.addEventListener('selectend', onSelectEnd);

    const geometry = new THREE.BufferGeometry().setFromPoints( [ new THREE.Vector3( 0, 0, 0 ), new THREE.Vector3( 0, 0, - 1 ) ] );
    const line = new THREE.Line(geometry);
    line.name = 'line';

    controller1.add(line.clone());
    controller2.add(line.clone());

    raycaster = new THREE.Raycaster();
}

/**
 * Handle controller select start event
 * @param {Event} event - The select start event from the controller
 * Called when the controller trigger is pressed, attaches selected object to controller
 */
function onSelectStart(event) {
    const controller = event.target;

    const intersections = getIntersections(controller);

    if (intersections.length > 0) {
        const intersection = intersections[0];

        const object = intersection.object;
        object.material.emissive.b = 1;

        // No reparenting: keep the object in its original scene hierarchy
        controller.updateMatrixWorld(true);
        object.updateMatrixWorld(true);

        // Save selection and relative offset so object follows controller without changing parent
        controller.userData.selected = object;
        selectedObject = object;
        grabbingController = controller;
        selectionOffset.copy(controller.matrixWorld).invert().multiply(object.matrixWorld);
        selectedObject.matrixAutoUpdate = false;
    }

    controller.userData.targetRayMode = event.data.targetRayMode;
}

/**
 * Handle controller select end event
 * @param {Event} event - The select end event from the controller
 * Called when the controller trigger is released, detaches selected object from controller
 */
function onSelectEnd(event) {
    const controller = event.target;

    if ( controller.userData.selected !== undefined ) {
        const object = controller.userData.selected;
        object.material.emissive.b = 0;
        // Ensure it remains under the main group (idempotent if already there)
        if (object.parent !== group) group.attach( object );

        controller.userData.selected = undefined;
    }

    // Restore object update behavior and clear selection state
    if (selectedObject) {
        selectedObject.matrixAutoUpdate = true;
    }
    selectedObject = null;
    grabbingController = null;
}

/**
 * Get intersections between controller ray and scene objects
 * @param {THREE.XRController} controller - The XR controller to check intersections for
 * @returns {Array} Array of intersection objects
 */
function getIntersections(controller) {
    controller.updateMatrixWorld();

    raycaster.setFromXRController(controller);

    return raycaster.intersectObjects(group.children, false);
}

/**
 * Check and visualize intersections between controller and objects
 * @param {THREE.XRController} controller - The XR controller to check
 * Updates the controller's line length and highlights intersected objects
 */
function intersectObjects(controller) {
    if (controller.userData.targetRayMode === 'screen') return;

    if (controller.userData.selected !== undefined) return;

    const line = controller.getObjectByName('line');
    const intersections = getIntersections(controller);

    if (intersections.length > 0) {
        const intersection = intersections[0];

        const object = intersection.object;
        object.material.emissive.r = 1;
        intersected.push( object );

        line.scale.z = intersection.distance;
    } else {
        line.scale.z = 5;
    }
}

/**
 * Clean up highlighted intersected objects
 * Removes the red emissive highlight from all previously intersected objects
 */
function cleanIntersected() {
    while ( intersected.length ) {
        const object = intersected.pop();
        object.material.emissive.r = 0;
    }
}

/**
 * Handle button press events from VR controllers
 * @param {string} hand - The handedness of the controller ("left" or "right")
 * @param {number} buttonIndex - The index of the pressed button
 * Executes the corresponding action defined in buttonActions map
 */
function onButtonPressed(hand, buttonIndex) {
    // Button 4: A/X button
    // Button 5: B/Y button
    const action = buttonActions[hand]?.[buttonIndex];
    
    if (action) action();
}

/**
 * Poll gamepad controllers and update locomotion values
 * Reads joystick axes for movement and detects button presses
 * Updates the global locomotion array with movement values for X, Y, and Z axes
 */
function onGamePadController() {
    var handedness = "unknown";
    const session = renderer.xr.getSession();

    if (session) {
        let xrCamera = renderer.xr.getCamera(camera);

        for (const source of session.inputSources) {
            if (source && source.handedness) {
                handedness = source.handedness;
            }
            if (!source.gamepad) continue;

            const old = prevGamePads.get(source);
            const data = {
                handedness: handedness,
                buttons: source.gamepad.buttons.map((b) => b.value),
                axes: source.gamepad.axes.slice(2)
            };
            
            if (data.handedness == "left") {
                locomotion[0] = (Math.abs(data.axes[1]) > 0.4) ? data.axes[1] : 0.0;
                locomotion[2] = (Math.abs(data.axes[0]) > 0.4) ? data.axes[0] : 0.0;
            }
            else if (data.handedness == "right") {
                locomotion[1] = (Math.abs(data.axes[1]) > 0.4) ? data.axes[1] : 0.0;
            }

            // Handle buttons (only if we have previous state)
            if (old) {
                data.buttons.forEach((value, i) => {
                    // Button pressed (value changed from not pressed to pressed)
                    if (value !== old.buttons[i]) {
                        if (value === 1) { // Fully pressed
                            onButtonPressed(data.handedness, i);
                        }
                    }
                });
            }
            
            // Store current state for next frame
            prevGamePads.set(source, data);
        }
    }
}

/**
 * Move the character/dolly based on locomotion input
 * @param {number} dt - Delta time in seconds since last frame
 * Applies movement relative to camera orientation for X/Z and absolute for Y
 */
function characterMove(dt) {
    const session = renderer.xr.getSession();

    if (session) {
        const speed = 10;
        
        const quaternion = dolly.quaternion.clone();
        const targetQuaternion = new THREE.Quaternion();
        dolly.quaternion.copy(dummyCam.getWorldQuaternion(targetQuaternion));
        
        // Locomotion X/Z (left joystick) - relative to camera
        dolly.translateZ(locomotion[0] * dt * speed);
        dolly.translateX(locomotion[2] * dt * speed);
        
        // Restore original rotation before moving y
        dolly.quaternion.copy(quaternion);
        
        // Locomotion Y (right joystick) - absolute
        dolly.position.y += -locomotion[1] * dt * speed;
    }
}

/**
 * Update eye positions based on VR or non-VR mode
 * 
 * In VR mode with vrMode enabled, retrieves actual eye positions from the XR device
 * and transforms them to world space using the dolly matrix.
 * Otherwise, calculates eye positions based on head model.
 * 
 * Updates global variables: leftEye, rightEye
 */
function updateEyePositions() {
    const isVR = renderer.xr.isPresenting;
    
    if (isVR && vrMode) {
        const xrFrame = renderer.xr.getFrame();
        const refSpace = renderer.xr.getReferenceSpace();
        const viewerPose = xrFrame.getViewerPose(refSpace);
        const pL = viewerPose.views[0].transform.position;
        const pR = viewerPose.views[1].transform.position;

        const localLeftEye  = new THREE.Vector3(pL.x, pL.y, pL.z);
        const localRightEye = new THREE.Vector3(pR.x, pR.y, pR.z);

        dolly.updateMatrixWorld(true);
        leftEye  = localLeftEye.applyMatrix4(dolly.matrixWorld);
        rightEye = localRightEye.applyMatrix4(dolly.matrixWorld);
    } else {
        leftEye  = getLeftEyePosition();
        rightEye = getRightEyePosition();
    }
}

/**
 * Handle VR controller interactions and movement
 * 
 * Processes gamepad input for movement and handles controller-object intersections
 * for grabbing and manipulating objects in VR.
 * 
 * @param {number} dt - Delta time in seconds since last frame
 */
function handleVRInteractions(dt) {
    cleanIntersected();
    
    // Joystick movement
    onGamePadController();
    characterMove(dt);
    
    // Controllers interaction
    intersectObjects(controller1);
    intersectObjects(controller2);
}

/**
 * Render the main scene from the current camera viewpoint
 * 
 * Sets up the renderer for initial scene rendering and handles different
 * rendering paths for VR and non-VR modes.
 */
function renderMainScene() {
    const isVR = renderer.xr.isPresenting;
    
    renderer.setRenderTarget(null);
    renderer.setClearColor(0x808080);
    renderer.clear();

    if (isVR) {
        if (showScene) renderer.render(scene, camera);
        renderTargetSaved = renderer.getRenderTarget();
        xrEnabledSaved = renderer.xr.enabled;
        renderer.xr.enabled = false;
    } else {
        if (showScene) renderer.render(scene, camera);
    }
}

/**
 * Render stereoscopic view to display surface textures
 * 
 * For each display surface, renders the scene from both eye positions using
 * anaglyph color separation (left eye = red channel, right eye = green/blue channels).
 * This creates the stereoscopic effect for the CAVE display walls.
 * 
 * @param {WebGLRenderingContext} gl - WebGL context for color mask manipulation
 */
function renderToDisplaySurfaces(gl) {
    for (let [index, displaySurface] of displaySurfaces.entries()) {
        renderer.setRenderTarget(displaySurfaceTargets[index]);
        renderer.setClearColor(0x404040);
        renderer.clear();

        // Render left eye on RED channel
        gl.colorMask(1, 0, 0, 0); 
        const leftView = displaySurface.viewMatrix(leftEye);
        const leftProj = displaySurface.projectionMatrix(leftEye, 1, 10000);
        const leftCamera = cameraFromViewProj(leftView, leftProj);
        renderer.render(scene, leftCamera); 
    
        // Render right eye on GREEN and BLUE channels
        gl.colorMask(0, 1, 1, 0);
        const rightView = displaySurface.viewMatrix(rightEye);
        const rightProj = displaySurface.projectionMatrix(rightEye, 1, 10000);
        const rightCamera = cameraFromViewProj(rightView, rightProj);
        renderer.clearDepth();
        renderer.render(scene, rightCamera); 
        
        // Restore full color mask
        gl.colorMask(1, 1, 1, 1);
    }
}

/**
 * Restore renderer state after display surface rendering
 * 
 * Restores the render target and XR settings to their pre-rendering state,
 * handling both VR and non-VR contexts appropriately.
 */
function restoreRendererState() {
    const isVR = renderer.xr.isPresenting;
    
    if (isVR) {
        renderer.setRenderTarget(renderTargetSaved);
        renderer.xr.enabled = xrEnabledSaved;
    } else {
        renderer.setRenderTarget(null);
        renderer.setClearColor(0x000000);
    }
}

/**
 * Render overlay elements (display surfaces, eyes, UI)
 * 
 * Renders the textured display surface quads, eye representations,
 * and VR UI elements in the appropriate order.
 */
function renderOverlays() {
    // Render display surfaces as textured quads
    renderer.render(displaySurfaceScene, camera);

    // Render eye representations
    renderer.render(eyeScene, camera);

    // Render UI elements (only in VR)
    if (renderer.xr.isPresenting) {
        renderer.render(uiGroup, camera);
    }
}

/**
 * Update and render viewing frustum visualization
 * 
 * Displays the viewing frustum from the selected eye to the current display surface.
 * The frustum visualization helps debug and understand the stereo rendering geometry.
 * 
 * Controlled by: showEyeFrustrum (0=off, 1=left eye, 2=right eye)
 */
function updateFrustumVisualization() {
    // Clear existing frustum lines
    for (let line of frustumLines) {
        eyeScene.remove(line);
    }
    frustumLines = [];

    // Draw new frustum if enabled
    if (showEyeFrustrum > 0) {
        const eyePos = (showEyeFrustrum === 1) ? getLeftEyePosition() : getRightEyePosition();
        const lines = displaySurfaces[currentSurface].showEyeFrustrum(eyePos);
        eyeScene.add(lines);
        frustumLines.push(lines);
    }
}

/**
 * Update grabbed object position based on controller movement
 * 
 * If an object is currently grabbed by a VR controller, updates its position
 * and orientation to follow the controller while maintaining the initial grab offset.
 */
function updateGrabbedObject() {
    if (selectedObject && grabbingController) {
        const world = tempMatrix2.multiplyMatrices(
            grabbingController.matrixWorld,
            selectionOffset
        );

        const parentInv = tempMatrix.copy(selectedObject.parent.matrixWorld).invert();
        const local = world.clone().premultiply(parentInv);

        selectedObject.matrix.copy(local);
        selectedObject.matrix.decompose(
            selectedObject.position,
            selectedObject.quaternion,
            selectedObject.scale
        );
    }
}

/**
 * Main animation loop
 * 
 * Orchestrates the entire rendering pipeline for each frame:
 * 1. Updates animations and eye positions
 * 2. Handles VR interactions (if in VR mode)
 * 3. Renders main scene
 * 4. Renders stereoscopic views to display surfaces
 * 5. Renders overlay elements (surfaces, eyes, UI)
 * 6. Updates debug visualizations (frustum)
 * 7. Updates grabbed objects
 * 
 * Called automatically by the browser's requestAnimationFrame or WebXR frame loop.
 */
function animate() {
    const gl = renderer.getContext();
    const isVR = renderer.xr.isPresenting;
    const dt = clock.getDelta();

    // Update animations
    updateTunnelCylinders(dt);

    // Update eye positions based on mode
    updateEyePositions();

    // Handle VR-specific interactions
    if (isVR) {
        handleVRInteractions(dt);
    }

    // Render main scene
    renderMainScene();

    // Render stereoscopic views to display surfaces
    renderToDisplaySurfaces(gl);

    // Restore renderer state
    restoreRendererState();

    // Render overlay elements
    renderOverlays();

    // Update debug visualizations
    updateFrustumVisualization();

    // Update grabbed objects
    updateGrabbedObject();
}
